<div class="game-board">
  <score-board [blueScore]="blueScore" [redScore]="redScore" (change)="onAward($event)"></score-board>

  <table class="board-table" role="table" aria-label="Game board" [style.--cols]="board.length">
    <thead>
      <tr>
        @for (cat of board; track cat) {
          <th>{{ cat.name }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (_row of board[0].questions; let rowIndex = $index; track _row) {
        <tr>
          @for (cat of board; let catIndex = $index; track cat) {
            <td>
              <!-- determine id for the question -->
              @let q = cat.questions[rowIndex];
              @let qid = q.id ?? `${catIndex}-${rowIndex}`;
              <button
                class="tile"
                [class.awarded-blue]="awarded[qid] === 'blue'"
                [class.awarded-red]="awarded[qid] === 'red'"
                [disabled]="awarded[qid] !== undefined"
                (click)="onTileClick(q)"
                type="button"
              >
                {{ q.points }}
              </button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>

  <question-modal
    [open]="modalOpen"
    [questionText]="selectedQuestion.question"
    [points]="selectedQuestion.points"
    (close)="onModalClose()"
    (awarded)="onAward($event)"
  ></question-modal>
</div>
