<div class="score-board">
  @for (team of enabledTeams(); track team.id) {
    <mat-card
      class="team"
      [attr.data-team]="team.id"
      [style.background-color]="teamColors[team.id]"
    >
      <mat-card-title>{{ team.name }}</mat-card-title>
      <mat-card-content>
        <div class="team-row">
          <div class="score">{{ scores()[team.id] }}</div>
          <div class="controls">
            <button mat-stroked-button type="button" (click)="sub(team.id)">-100</button>
            <button mat-flat-button type="button" (click)="add(team.id)">+100</button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
