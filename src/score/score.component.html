<div class="score-board">
  <mat-card class="team blue">
    <mat-card-title>Blue Team</mat-card-title>
    <mat-card-content>
      <div class="team-row">
        <div class="score">{{ blueScore }}</div>
        <div class="controls">
          <button mat-stroked-button color="primary" (click)="sub('blue')">-100</button>
          <button mat-flat-button color="primary" (click)="add('blue')">+100</button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="team red">
    <mat-card-title>Red Team</mat-card-title>
    <mat-card-content>
      <div class="team-row">
        <div class="score">{{ redScore }}</div>
        <div class="controls">
          <button mat-stroked-button color="warn" (click)="sub('red')">-100</button>
          <button mat-flat-button color="warn" (click)="add('red')">+100</button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
