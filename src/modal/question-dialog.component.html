<mat-card class="question-card">
  <mat-card-content>
    <div class="dialog-body">
      <p class="question-text">{{ data.questionText }}</p>
      <p class="points">Points: {{ data.points }}</p>
      <mat-checkbox class="verse-ref" (change)="onVerseChange($event)" name="verse-ref">Verse Reference
        +100</mat-checkbox>
    </div>
  </mat-card-content>
  <mat-card-actions align="end" class="actions">
    @for (team of teams; track team) {
      <button
        mat-raised-button
        class="award-team"
        [attr.data-team]="team.id"
        [style.background-color]="teamColors[team.id]"
        type="button"
        (click)="award(team.id, verseReference)"
      >
        Award {{ team.name }} Team
      </button>
    }
    @if (teams.length === 0) {
      <p class="no-teams">Enable a team in Settings to award points.</p>
    }
    <button mat-button type="button" (click)="close()">Close</button>
  </mat-card-actions>
</mat-card>
