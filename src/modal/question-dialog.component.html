<mat-card class="question-card">
  <mat-card-content>
    <div class="dialog-body">
      <p class="question-text">{{ data.questionText }}</p>
      <p class="points">Points: {{ data.points }}</p>
      <mat-checkbox class="verse-ref" (change)="onVerseChange($event)" name="verse-ref">Verse Reference
        +100</mat-checkbox>
    </div>
  </mat-card-content>
  <mat-card-actions align="end" class="actions">
    <button mat-raised-button class="award-blue" (click)="award('blue', verseReference)">Award Blue Team</button>
    <button mat-raised-button class="award-red" (click)="award('red', verseReference)">Award Red Team</button>
  </mat-card-actions>
</mat-card>
