@if (open) {
<div class="modal-backdrop">
    <mat-dialog-content class="modal">
        <div class="modal-header">
            <h3>Question</h3>
        </div>
        <div class="modal-body">
            <p class="question-text">{{ questionText }}</p>
            <p class="points">Points: {{ points }}</p>
        </div>
        <div class="modal-footer">
            <button class="btn blue" mat-raised-button color="primary" (click)="award('blue')">Award Blue Team</button>
            <button class="btn red" mat-raised-button color="warn" (click)="award('red')">Award Red Team</button>
        </div>
    </mat-dialog-content>
</div>
}
